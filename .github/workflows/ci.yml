name: Continuous Integration

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Installing project dependencies
        run: |
          npm ci
      - name: Check Types
        run:
          npm run check
      - name: Build
        run: |
           npm run build
